{% extends "base_admin.html" %}
{% block title %}Update Customer{% endblock %}

{% block content %}

<div class="d-flex justify-content-center mb-4">
  <div class="activity-header-box">
    <h1 class="admin-dashboard-title">Update Customer</h1>
  </div>
</div>

<div class="container-xl">
  <form method="post" class="row g-4">

    <!-- Main Info -->
    <div class="col-12 col-lg-7">
      <div class="activity-card">
        <div class="activity-card-header">Main Info</div>
        <div class="activity-card-body">

          <div class="mb-3">
            <label class="form-label">Customer name</label>
            <input type="text" class="form-control" name="customer_name"
                   value="{{ customer.customer_name or '' }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contact person</label>
            <input type="text" class="form-control" name="contact_person"
                   value="{{ customer.contact_person or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email"
                   value="{{ customer.email or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone"
                   value="{{ customer.phone or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address"
                   value="{{ customer.address or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Website</label>
            <input type="text" class="form-control" name="website"
                   value="{{ customer.website or '' }}">
          </div>

        </div>
      </div>
    </div>

    <!-- Business Info -->
    <div class="col-12 col-lg-5">
      <div class="activity-card">
        <div class="activity-card-header">Business Info</div>
        <div class="activity-card-body">

          <div class="mb-3">
            <label class="form-label">Customer type</label>
            <input type="text" class="form-control" name="type"
                   value="{{ customer.type or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Industry</label>
            <input type="text" class="form-control" name="industry"
                   value="{{ customer.industry or '' }}">
          </div>

          <div class="mb-3">
            <label class="form-label">Revenue value (EUR)</label>
            <input type="text" class="form-control" name="rev_value_euro"
                   value="{{ customer.rev_value_euro if customer.rev_value_euro is not none else '' }}">
          </div>

        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="col-12">
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary"
           href="{{ url_for('employee_customer_detail', customer_id=customer.id) }}">
          Back
        </a>
      </div>
    </div>

  </form>
</div>

{% endblock %}
