{% extends 'base_employee.html' %}
{% block title %}Create Customer{% endblock %}

{% block content %}
<div class="container-xl mt-4">


<!-- Centered Dashboard title -->
<div class="d-flex justify-content-center mb-4">
    <div class="activity-header-box">
        <h1 class="admin-dashboard-title">Add new Contact with Customer</h1>
    </div>
</div>

<form method="post" action="{{ url_for('employee_add_cus_cont') }}">

  <div class="activity-card">
    <div class="activity-card-header">
      Contact Info:
    </div>
  </div> 

    <div class="activity-card-body">

      <div class="activity-row">
        <label>Customer name:</label>
        <input type="text" name="customer_name" required>
      </div>

      <div class="activity-row">
        <label>Contact Person:</label>
        <input type="text" name="contact_person">
      </div>

      <div class="activity-row">
        <label>Email:</label>
        <input type="email" name="email">
      </div>

      <div class="activity-row">
        <label>Contact Phone:</label>
        <input type="text" name="phone">
      </div>

      <div class="activity-row">
        <label>Topics Discussed</label>
        <input type="text" name="topics">
      </div>

      <div class="activity-row">
        <label>Notes:</label>
        <input type="text" name="notes">
      </div>

      <div class="activity-row">
        <label>Last Contact:</label>
        <input type="date" name="last_contact">
      </div>

  <button type="submit" class="btn btn-primary mt-3">
    New Contact
  </button>
  
    </div>

</form>
{% endblock %}
